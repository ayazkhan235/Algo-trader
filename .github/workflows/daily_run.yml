name: Daily NSE Halal Algo Trader

on:
  schedule:
    - cron: '30 2 * * 1-5'   # 8:00 AM IST (UTC+5:30) on weekdays
  workflow_dispatch:           # Allow manual trigger from GitHub UI

jobs:
  daily-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Run full Nifty500 scan (Sundays)
        if: github.event.schedule == '30 2 * * 0'
        env:
          UPSTOX_API_KEY:    ${{ secrets.UPSTOX_API_KEY }}
          UPSTOX_API_SECRET: ${{ secrets.UPSTOX_API_SECRET }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          GMAIL_CLIENT_ID:   ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          REPORT_EMAIL_TO:   ${{ secrets.REPORT_EMAIL_TO }}
        run: python main.py scan --universe nifty500 --output csv

      - name: Run Nifty50 scan (weekdays)
        if: github.event.schedule != '30 2 * * 0'
        env:
          UPSTOX_API_KEY:    ${{ secrets.UPSTOX_API_KEY }}
          UPSTOX_API_SECRET: ${{ secrets.UPSTOX_API_SECRET }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          GMAIL_CLIENT_ID:   ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          REPORT_EMAIL_TO:   ${{ secrets.REPORT_EMAIL_TO }}
        run: python main.py scan --universe nifty50 --output csv

      - name: Upload signal report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signals-${{ github.run_id }}
          path: output/*.csv
          retention-days: 30
