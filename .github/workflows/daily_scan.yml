name: Daily Halal Stock Scan

on:
  schedule:
    - cron: "0 4 * * 1-5"   # 9:30 AM IST (4:00 UTC), weekdays only
  workflow_dispatch:          # manual trigger button on GitHub

permissions:
  contents: write             # needed to commit results back to repo

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run halal stock scan
        env:
          POSITION_SIZE_INR: "5000"
        run: |
          python main.py scan \
            --universe nifty50 \
            --top-n 20 \
            --min-score 50 \
            --output csv \
            --mode STANDARD \
          2>&1 | tee output/scan_log.txt

      - name: Generate portfolio snapshot
        run: python -c "
          import sys, json
          from paper_trading.sqlite_engine import portfolio_summary, get_all_trades
          summary = portfolio_summary()
          trades  = get_all_trades()
          print(json.dumps({'summary': summary, 'trades': trades}, indent=2, default=str))
          " > output/portfolio_snapshot.json 2>/dev/null || echo "{}" > output/portfolio_snapshot.json

      - name: Commit results back to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "chore: daily scan $(date -u '+%Y-%m-%d') [skip ci]"
          git push

      - name: Post scan summary to job summary
        run: |
          echo "## Halal Scan — $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Top signals from CSV
          CSV=$(ls output/signals_*.csv 2>/dev/null | sort | tail -1)
          if [ -f "$CSV" ]; then
            echo "### Top Signals" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            head -21 "$CSV" | column -t -s, >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          # Portfolio snapshot
          if [ -f output/portfolio_snapshot.json ]; then
            echo "### Paper Portfolio" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            python -c "
          import json
          d = json.load(open('output/portfolio_snapshot.json'))
          s = d.get('summary', {})
          print(f\"Open positions : {s.get('open_positions', 0)}\")
          print(f\"Total invested : ₹{s.get('total_invested', 0):,.0f}\")
          print(f\"Current value  : ₹{s.get('total_value', 0):,.0f}\")
          print(f\"Open P&L       : ₹{s.get('open_pnl_inr', 0):+,.0f}  ({s.get('open_pnl_pct', 0):+.1%})\")
          print(f\"Closed trades  : {s.get('closed_trades', 0)}  (P&L: ₹{s.get('closed_pnl_inr', 0):+,.0f})\")
          " 2>/dev/null || echo "No trades yet"
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Full results: [output/](./output/)" >> $GITHUB_STEP_SUMMARY
