name: Daily Halal Stock Scan + Upstox Paper Trades

on:
  schedule:
    - cron: "30 2 * * 1-5"   # 8:00 AM IST (2:30 UTC), weekdays — runs early so GitHub delays land it ~9–10 AM IST
  workflow_dispatch:          # manual "Run workflow" button on GitHub

permissions:
  contents: write

jobs:
  scan-and-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      UPSTOX_API_KEY:      ${{ secrets.UPSTOX_API_KEY }}
      UPSTOX_API_SECRET:   ${{ secrets.UPSTOX_API_SECRET }}
      UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
      UPSTOX_REDIRECT_URI: "http://127.0.0.1:8080/callback"
      UPSTOX_SANDBOX:      "true"
      POSITION_SIZE_INR:   "5000"
      # Shared persistent store (Render Postgres) — keeps paper history across runs.
      # Falls back to committed sqlite DB if unset.
      DATABASE_URL:        ${{ secrets.DATABASE_URL }}
      # Google Sheets dashboard
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEET_ID:     ${{ secrets.GOOGLE_SHEET_ID }}
      GSHEET_SHARE_EMAIL:  ${{ secrets.GSHEET_SHARE_EMAIL }}
      # Email trade notifications (Gmail API OAuth)
      GMAIL_CLIENT_ID:     ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      REPORT_EMAIL_TO:     ${{ secrets.REPORT_EMAIL_TO }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Step 1: Run the halal scan + record paper trades + sync to Sheets ─────
      # Running without --no-execute records BUY/STRONG BUY signals as paper
      # trades in the DB, then automatically syncs the portfolio to Google Sheets.
      - name: Run halal scan, record paper trades & sync to Google Sheets
        run: |
          python main.py scan \
            --universe nifty50 \
            --top-n 20 \
            --min-score 50 \
            --output csv \
            --mode STANDARD \
          2>&1 | tee output/scan_log.txt

      # ── Step 2: Portfolio snapshot ────────────────────────────────────────────
      - name: Save portfolio snapshot
        run: |
          python - <<'EOF'
          import json, sys
          sys.path.insert(0, ".")
          try:
              from paper_trading.sqlite_engine import portfolio_summary, get_all_trades
              out = {"summary": portfolio_summary(), "trades": get_all_trades()}
          except Exception as e:
              out = {"error": str(e)}
          with open("output/portfolio_snapshot.json", "w") as f:
              json.dump(out, f, indent=2, default=str)
          EOF

      # ── Step 5: Commit results ────────────────────────────────────────────────
      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Persist the saved sheet id and (when no Postgres) the sqlite paper DB
          git add output/
          git add -f output/gsheet_id.txt output/paper_trades.db 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: scan $(date -u '+%Y-%m-%d') [skip ci]"
          git push

      # ── Step 6: Job summary ───────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          echo "## Halal Algo Trader — $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "_Upstox Sandbox · paper trading · ₹5,000/position_" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          ORDERS=$(ls output/upstox_orders_*.json 2>/dev/null | sort | tail -1)
          if [ -f "$ORDERS" ]; then
            COUNT=$(python -c "import json; print(len(json.load(open('$ORDERS'))))" 2>/dev/null || echo 0)
            echo "### Orders Placed on Upstox Sandbox: $COUNT" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            python -c "
          import json
          orders = json.load(open('$ORDERS'))
          for o in orders:
              print(f\"{o['symbol']:15} {o['tier']:12} score={o['score']}  qty={o['qty']}  ₹{o['order_value']:,.0f}  id={o['order_id']}\")
          " 2>/dev/null
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f output/portfolio_snapshot.json ]; then
            echo "### Paper Portfolio" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            python -c "
          import json
          s = json.load(open('output/portfolio_snapshot.json')).get('summary', {})
          print(f\"Open positions : {s.get('open_positions', 0)}\")
          print(f\"Total invested : Rs{s.get('total_invested', 0):,.0f}\")
          print(f\"Open P&L       : Rs{s.get('open_pnl_inr', 0):+,.0f}  ({s.get('open_pnl_pct', 0):+.1%})\")
          " 2>/dev/null || echo "No data yet"
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
