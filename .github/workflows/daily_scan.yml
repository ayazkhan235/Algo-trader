name: Daily Halal Stock Scan + OpenAlgo Paper Trades

on:
  schedule:
    - cron: "0 4 * * 1-5"   # 9:30 AM IST (4:00 UTC), weekdays only
  workflow_dispatch:          # manual "Run workflow" button on GitHub

permissions:
  contents: write

jobs:
  scan-and-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      OPENALGO_HOST:    ${{ secrets.OPENALGO_HOST }}      # e.g. https://yourapp.onrender.com
      OPENALGO_API_KEY: ${{ secrets.OPENALGO_API_KEY }}   # from OpenAlgo dashboard
      POSITION_SIZE_INR: "5000"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Step 1: Check OpenAlgo is reachable ──────────────────────────────────
      - name: Check OpenAlgo connection
        run: |
          python - <<'EOF'
          import os, sys
          sys.path.insert(0, ".")
          from brokers.openalgo_client import ping
          if not ping():
              print(f"::error::Cannot reach OpenAlgo at {os.getenv('OPENALGO_HOST')}")
              print("::error::Make sure OpenAlgo is deployed and OPENALGO_HOST secret is set correctly")
              sys.exit(1)
          print(f"::notice::OpenAlgo reachable ✓  ({os.getenv('OPENALGO_HOST')})")
          EOF

      # ── Step 2: Run the halal scan ───────────────────────────────────────────
      - name: Run halal stock scan (Nifty 50)
        run: |
          python main.py scan \
            --universe nifty50 \
            --top-n 20 \
            --min-score 50 \
            --output csv \
            --mode STANDARD \
            --no-execute \
          2>&1 | tee output/scan_log.txt

      # ── Step 3: Place orders via OpenAlgo ────────────────────────────────────
      - name: Place paper trades via OpenAlgo
        run: |
          python - <<'EOF'
          import os, json, sys, math
          sys.path.insert(0, ".")
          import config

          config.LIVE_POSITION_SIZE_INR = int(os.getenv("POSITION_SIZE_INR", 5000))

          from data.nse_universe import get_symbols
          from data.fetcher import fetch_batch
          from screening.halal_screener import screen_batch
          from analysis.fundamental import compute
          from analysis.scorer import compute_conviction_score
          from signals.generator import generate
          from brokers.openalgo_client import place_buy

          symbols = get_symbols("nifty50")
          data    = fetch_batch(symbols, max_workers=5)
          halal   = screen_batch(data)
          passed  = {s: d for s, d in data.items() if halal[s].passed}
          metrics = {s: compute(s, d) for s, d in passed.items()}
          scores  = {s: compute_conviction_score(d, metrics[s]) for s, d in passed.items()}
          signals = generate(data, halal, metrics, scores, min_score=50)

          placed = []
          for sig in signals:
              if sig.tier not in ("STRONG BUY", "BUY"):
                  continue
              price = sig.metrics.get("price")
              if not price:
                  continue
              try:
                  result = place_buy(sig.symbol, price, sig.tier)
                  status = result.get("status", "?")
                  order_id = result.get("orderid", result.get("data", {}).get("orderid", "?"))
                  print(f"  [ORDER] {sig.symbol.replace('.NS','')}  {sig.tier}  score={sig.score:.0f}  ₹{price:,.0f}  → {status}  id={order_id}")
                  placed.append({
                      "symbol":   sig.symbol.replace(".NS", ""),
                      "tier":     sig.tier,
                      "score":    round(sig.score, 1),
                      "price":    price,
                      "status":   status,
                      "order_id": order_id,
                  })
              except Exception as e:
                  print(f"  [FAIL]  {sig.symbol} — {e}")

          os.makedirs("output", exist_ok=True)
          from datetime import date
          log_file = f"output/openalgo_orders_{date.today()}.json"
          with open(log_file, "w") as f:
              json.dump(placed, f, indent=2)
          print(f"\n[done] {len(placed)} orders sent to OpenAlgo → {log_file}")
          EOF

      # ── Step 4: Commit results ────────────────────────────────────────────────
      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "chore: scan $(date -u '+%Y-%m-%d') [skip ci]"
          git push

      # ── Step 5: Job summary ───────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          echo "## Halal Algo Trader — $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "_OpenAlgo · Upstox Sandbox · ₹5,000/position_" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          ORDERS=$(ls output/openalgo_orders_*.json 2>/dev/null | sort | tail -1)
          if [ -f "$ORDERS" ]; then
            COUNT=$(python -c "import json; print(len(json.load(open('$ORDERS'))))" 2>/dev/null || echo 0)
            echo "### Orders Sent to OpenAlgo: $COUNT" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            python -c "
          import json
          for o in json.load(open('$ORDERS')):
              print(f\"{o['symbol']:15} {o['tier']:12} score={o['score']}  ₹{o['price']:,.0f}  {o['status']}\")
          " 2>/dev/null
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View portfolio: $OPENALGO_HOST" >> $GITHUB_STEP_SUMMARY
